[project]
name = "trading-platform"
version = "0.1.0"
description = "Plataforma de trading algoritmico modular para crypto spot"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Cache / Pub-Sub
    "redis[hiredis]>=5.0.0",

    # Validation / Config
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Exchange
    "python-binance>=1.0.19",

    # Technical indicators
    "pandas>=2.2.0",
    "pandas-ta>=0.3.14b",

    # Logging
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
