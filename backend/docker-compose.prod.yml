# Production override — use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up
services:
  app:
    environment:
      - SECRETS_BACKEND=docker-secrets
      - DEBUG=false
      - EXECUTION_MODE=PAPER
    secrets:
      - database_url
      - api_key
      - binance_api_key
      - binance_api_secret
      - telegram_bot_token

secrets:
  database_url:
    file: ./secrets/database_url.txt
  api_key:
    file: ./secrets/api_key.txt
  binance_api_key:
    file: ./secrets/binance_api_key.txt
  binance_api_secret:
    file: ./secrets/binance_api_secret.txt
  telegram_bot_token:
    file: ./secrets/telegram_bot_token.txt
